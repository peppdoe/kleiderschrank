<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111;font:15px/1.35 -apple-system,system-ui,sans-serif}
.top{padding:56px 16px 0}
.top small{font-size:15px;color:#8e8e93}
h1{font:700 34px/1.1 -apple-system,system-ui;margin:2px 0 12px}
.search{background:#f2f2f7;border-radius:10px;padding:10px 12px;color:#8e8e93;margin-bottom:12px}
.seg{display:flex;background:#f2f2f7;border-radius:9px;padding:2px;margin-bottom:14px}
.seg span{flex:1;text-align:center;padding:7px 0;font-size:13px;font-weight:600;color:#3c3c43}
.seg span.on{background:#fff;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid div{aspect-ratio:1;background:#f2f2f7;display:flex;align-items:center;justify-content:center}
.grid div i{width:54%;height:70%;border-radius:10px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(249,249,249,.94);border-top:1px solid #d1d1d6;display:flex;padding-top:10px}
.tabs span{flex:1;text-align:center;font-size:11px;color:#8e8e93}
.tabs span.on{color:#e86a8a}
.fab{position:absolute;right:16px;top:58px;font-size:30px;color:#e86a8a}
</style></head><body>
<div class="top"><small>Guten Morgen, Lena</small><h1>Kleiderschrank</h1>
<div class="search">Suchen</div>
<div class="seg"><span class="on">Alle</span><span>Oberteile</span><span>Hosen</span><span>Schuhe</span></div></div>
<div class="fab">+</div>
<div class="grid">
  <div><i style="background:#2f6fdb"></i></div><div><i style="background:#1c1c1e"></i></div><div><i style="background:#8b5a2b"></i></div>
  <div><i style="background:#e0262f"></i></div><div><i style="background:#3a9d4f"></i></div><div><i style="background:#8e8e93"></i></div>
  <div><i style="background:#f4a6c1"></i></div><div><i style="background:#e8d8bd"></i></div><div><i style="background:#ffffff;border:1px solid #ddd"></i></div>
</div>
<div class="tabs"><span class="on">Schrank</span><span>Outfits</span><span>Einstellungen</span></div>
</body></html>
