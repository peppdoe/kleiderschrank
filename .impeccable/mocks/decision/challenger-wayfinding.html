<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#2a2a2a;color:#fff;font:15px/1.35 'Hanken Grotesk',system-ui,sans-serif}
.band{margin-top:48px;background:#ffd200;color:#111;padding:18px 18px 20px}
.band .k{font:700 13px 'Hanken Grotesk';letter-spacing:.04em}
.band h1{font:800 44px/1 'Hanken Grotesk';margin:8px 0 6px;letter-spacing:-.02em}
.band p{font:700 17px 'Hanken Grotesk'}
.sign{display:flex;align-items:center;gap:14px;background:#111;margin:10px 0 0;padding:16px 18px}
.sign .pic{width:52px;height:52px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font:800 26px 'Hanken Grotesk'}
.sign .t{flex:1}
.sign .t b{display:block;font:700 22px 'Hanken Grotesk'}
.sign .t span{font:500 14px 'Hanken Grotesk';color:#bbb}
.sign .arr{font:800 30px 'Hanken Grotesk';color:#ffd200}
.thumbs{display:flex;gap:4px;padding:0 18px 14px;background:#111}
.thumbs i{width:46px;height:46px;display:block}
.more{margin:16px 18px;font:700 15px 'Hanken Grotesk';color:#ffd200}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#111;display:flex;padding-top:12px;border-top:3px solid #ffd200}
.tabs span{flex:1;text-align:center;font:700 13px 'Hanken Grotesk';color:#999}
.tabs span.on{color:#ffd200}
</style></head><body>
<div class="band"><div class="k">Freitag, 10. Oktober · Guten Morgen, Lena</div><h1>Herbst</h1><p>3 Outfits passen heute →</p></div>
<div class="sign"><div class="pic">1</div><div class="t"><b>Herbstspaziergang</b><span>5 Teile · Pulli, Jeans, Lederjacke</span></div><div class="arr">→</div></div>
<div class="thumbs"><i style="background:#3a9d4f"></i><i style="background:#1c1c1e"></i><i style="background:#8b5a2b"></i><i style="background:#fff"></i></div>
<div class="sign"><div class="pic">2</div><div class="t"><b>Büro-Look</b><span>4 Teile · Bluse, Stoffhose</span></div><div class="arr">→</div></div>
<div class="thumbs"><i style="background:#f2f2f2"></i><i style="background:#8e8e93"></i><i style="background:#fff"></i></div>
<div class="sign"><div class="pic">S</div><div class="t"><b>Ganzer Schrank</b><span>48 Teile durchsuchen</span></div><div class="arr">→</div></div>
<div class="tabs"><span class="on">Heute</span><span>Schrank</span><span>Outfits</span><span>Mehr</span></div>
</body></html>
